# plasma/kwinrc.beauty.conf - 仅收录美化相关键（本机实测值）
# 恢复方式见 install.sh：kwriteconfig6 逐键写入，不全盘覆盖 ~/.config/kwinrc
# （桌面/平铺/缩放等机器相关段 intentionally 不收录）
[Compositing]
Backend=OpenGL
Enabled=true

[NightColor]
Active=true
DayTemperature=6500
NightTemperature=5000

[Plugins]
blurEnabled=true
contrastEnabled=true
