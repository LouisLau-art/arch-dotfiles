# makepkg 加载顺序：/etc/makepkg.conf -> /etc/makepkg.conf.d/*.conf -> ${XDG_CONFIG_HOME:-~/.config}/pacman/makepkg.conf，后者覆盖前者。
# 本文件是系统级配置（所有用户生效）；如果某个用户自己的用户级配置里也定义了 DLAGENTS，会覆盖本文件。
# http/https 走包装器：GitHub 系 URL 自动改用镜像，不可用或龟速时回退直连。
DLAGENTS=('file::/usr/bin/curl -qgC - -o %o %u'
          'ftp::/usr/bin/curl -qgfC - --ftp-pasv --retry 3 --retry-delay 3 -o %o %u'
          'http::/usr/local/bin/makepkg-gh-mirror-curl -qgb "" -fLC - --retry 3 --retry-delay 3 -o %o %u'
          'https::/usr/local/bin/makepkg-gh-mirror-curl -qgb "" -fLC - --retry 3 --retry-delay 3 -o %o %u'
          'rsync::/usr/bin/rsync --no-motd -z %u %o'
          'scp::/usr/bin/scp -C %u %o')
